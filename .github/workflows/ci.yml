# Builds and checks every pull request to main and every push to main.
# See docs/CI.md.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# The workflow only needs to read the code.
permissions:
  contents: read

# A new push to the same pull request cancels the run that is still going.
# Runs on main are never cancelled, so every commit there gets a result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    # Shown in the pull request and required by the ruleset on main.
    # Renaming it means updating the ruleset too.
    name: Build and check
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      # JDK 17 compiles the app (Java toolchain); JDK 25 runs Gradle (gradle-daemon-jvm.properties).
      # The last version listed becomes JAVA_HOME.
      - name: Set up JDK 17 and 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            17
            25

      # Caches Gradle downloads and build outputs between runs (written only by runs on main),
      # and checks gradle-wrapper.jar against Gradle's official checksums.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # Formatting (Spotless), detekt, Android Lint, unit tests, and a debug APK.
      - name: Build and check
        run: ./gradlew check assembleDebug

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            build/reports/
            app/build/reports/
          retention-days: 7
